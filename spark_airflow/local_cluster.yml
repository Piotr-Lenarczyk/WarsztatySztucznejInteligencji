---
- name: Postawienie lokalnego klastra Spark (1 Master, 3 Workery) i Airflow
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    project_dir: "{{ playbook_dir }}/data_platform"
  tasks:
    - name: 1. Utwórz katalog projektowy
      file:
        path: "{{ project_dir }}"
        state: directory
        mode: '0755'
    
    - name: 2. Stwórz plik docker-compose.yml
      copy:
        dest: "{{ project_dir }}/docker-compose.yml"
        content: |
          version: '3.8'
          services:
            spark-master:
              image: apache/spark:latest
              container_name: spark-master
              ports:
                - '8080:8080'
                - '7077:7077'
              command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
              hostname: spark-master
              networks:
                - spark-net

            spark-worker-1:
              image: apache/spark:latest
              container_name: spark-worker-1
              environment:
                - SPARK_WORKER_MEMORY=1G
                - SPARK_WORKER_CORES=1
              depends_on:
                - spark-master
              command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
              hostname: spark-worker-1
              networks:
                - spark-net

            spark-worker-2:
              image: apache/spark:latest
              container_name: spark-worker-2
              environment:
                - SPARK_WORKER_MEMORY=1G
                - SPARK_WORKER_CORES=1
              depends_on:
                - spark-master
              command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
              hostname: spark-worker-2
              networks:
                - spark-net

            spark-worker-3:
              image: apache/spark:latest
              container_name: spark-worker-3
              environment:
                - SPARK_WORKER_MEMORY=1G
                - SPARK_WORKER_CORES=1
              depends_on:
                - spark-master
              command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
              hostname: spark-worker-3
              networks:
                - spark-net

            airflow:
              image: apache/airflow:2.7.1
              container_name: airflow-standalone
              environment:
                - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
                - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
                - AIRFLOW__CORE__LOAD_EXAMPLES=False
                - _AIRFLOW_DB_MIGRATE=true
                - _AIRFLOW_WWW_USER_CREATE=true
                - _AIRFLOW_WWW_USER_USERNAME=admin
                - _AIRFLOW_WWW_USER_PASSWORD=admin
              ports:
                - "8081:8080"
              command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com 2>/dev/null || true && airflow webserver -p 8080 & airflow scheduler"
              depends_on:
                - spark-master
              volumes:
                - airflow_db:/opt/airflow
              networks:
                - spark-net

          volumes:
            airflow_db:

          networks:
            spark-net:
              driver: bridge
    
    - name: "3. Uruchom kontenery"
      shell: |
        if docker compose version >/dev/null 2>&1; then
          docker compose down
          docker compose up -d
        else
          docker-compose down
          docker-compose up -d
        fi
      args:
        chdir: "{{ project_dir }}"

    - name: 3a. Pobierz sterownik PostgreSQL JDBC do Spark
      shell: |
        docker exec spark-master bash -c "wget -O /opt/spark/jars/postgresql-42.7.1.jar https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.1/postgresql-42.7.1.jar 2>/dev/null || true"
      args:
        chdir: "{{ project_dir }}"
    
    - name: 4. Wyświetl informację
      debug:
        msg: 
          - "Spark Master: http://localhost:8080"
          - "Airflow: http://localhost:8081 (admin/admin)"
